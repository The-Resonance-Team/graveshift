services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: graveshift_test
      POSTGRES_DB: graveshift_test
      POSTGRES_PASSWORD: local-test-only
    ports: ['127.0.0.1:${GRAVESHIFT_TEST_PG_PORT:-55438}:5432']
    tmpfs: [/var/lib/postgresql]
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graveshift_test -d graveshift_test']
      interval: 1s
      timeout: 3s
      retries: 30
networks:
  database: {}
