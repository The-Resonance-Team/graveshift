# Haunted Candy Shop: the fault-injectable target. Secrets come from the environment, never from this file.
# Standalone: docker compose -f deploy/compose/demo.compose.yml up --build
# With Graveshift: add -f deploy/compose/graveshift.compose.yml
name: graveshift

x-app: &app
  build:
    context: ../../examples/haunted-candy-shop
  image: haunted-candy-shop:local
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  networks: [candy]
  environment: &app-env
    DATABASE_URL: postgres://candy:${POSTGRES_PASSWORD:-}@postgres:5432/candy
    DATABASE_URL_STALE: postgres://candy:${POSTGRES_PASSWORD:-}@postgres:5432/candy_stale
    HAUNT_TOKEN: ${HAUNT_TOKEN:-}
    OWNER_TOKEN: ${OWNER_TOKEN:-}

services:
  api:
    <<: *app
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *app
    command: ['bun', 'src/worker-main.ts']
    mem_limit: 128m
    environment:
      <<: *app-env
      PORT: '3001'
    ports: ['127.0.0.1:3001:3001']

  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: candy
      POSTGRES_DB: candy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - candy-data:/var/lib/postgresql
    networks: [candy]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U candy -d candy']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  candy:
    name: candy

volumes:
  candy-data:
