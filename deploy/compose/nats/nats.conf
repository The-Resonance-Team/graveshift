# Self-hosted NATS server for platform v2.
# No secret is stored here. Every credential and TLS path comes from the
# process environment or a mounted secret. MQTT, leafnode and WebSocket have
# no config block, so the server opens no listener for them. One server uses
# one JetStream replica (R1).

# The container must bind 0.0.0.0 so other containers on the core network can
# connect. Privacy comes from compose expose and that internal network; no
# host port is published for NATS.
listen: 0.0.0.0:4222

# max_payload is a top-level server option, not a JetStream option.
max_payload: 131072

tls {
  cert_file: "/run/secrets/nats/tls.crt"
  key_file: "/run/secrets/nats/tls.key"
  ca_file: "/run/secrets/nats/ca.crt"
}

# Two users: the API publishes; the read side only reads. The read user also
# pulls, acks and writes exhausted envelopes to the dead-letter subject.
# CONSUMER.INFO is not granted: the client does not read consumer state; issue
# #105 owns that change if a client needs it.
# The operator NKey for backup comes from the secret store, not from this file.
authorization {
  users = [
    {
      user: $NATS_PUBLISH_USER
      password: $NATS_PUBLISH_PASSWORD
      permissions: {
        publish: ["graveshift.>"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: $NATS_READ_USER
      password: $NATS_READ_PASSWORD
      permissions: {
        publish: [
          "$JS.API.STREAM.INFO.GRAVESHIFT_EVENTS"
          "$JS.API.DIRECT.GET.GRAVESHIFT_EVENTS.>"
          "$JS.API.CONSUMER.MSG.NEXT.GRAVESHIFT_EVENTS.graveshift-watcher"
          "$JS.ACK.GRAVESHIFT_EVENTS.>"
          "graveshift.*.dlq.*"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}

jetstream {
  store_dir: "/data/jetstream"
}

# Monitoring binds to localhost only; never expose 8222 to the internet.
http: 127.0.0.1:8222

# No cluster block: v2 runs one server, so no route port is opened.
# No mqtt, leafnodes or websocket block: those protocols have no listener.
