# Graveshift support services in Compose mode. The daemon is not started here.
# The actuator is the only writer and reaches Docker through its restart-only proxy.
# No real secrets here: values come from the environment; empty means the feature refuses to run.
name: graveshift

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp]

services:
  socket-proxy:
    # Read-only: containers, events, logs and info; every write verb is off.
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      LOGS: '1'
      INFO: '1'
      POST: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [core]

  socket-proxy-actuator:
    # Used only by the actuator; container restart is the single write permitted.
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      CONTAINERS: '1'
      POST: '1'
      ALLOW_RESTARTS: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [act]

  actuator:
    # SEC-2: separate container; executes approved, HMAC-signed, single-use actions only.
    <<: *hardened
    build:
      context: ../..
      dockerfile: deploy/compose/bun.Dockerfile
      args: { APP_PATH: packages/actuator }
    image: graveshift/actuator:local
    command: ['bun', 'src/main.ts']
    environment:
      DOCKER_PROXY_URL: http://socket-proxy-actuator:2375
      ACTUATOR_HMAC_SECRET: ${ACTUATOR_HMAC_SECRET:-}
      POLICY_PATH: /config/policy.yaml
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
    volumes:
      - ../../policy.example.yaml:/config/policy.yaml:ro
    networks: [core, act]
    depends_on: [socket-proxy-actuator]
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:2603/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [core, candy]

networks:
  core: {}
  act:
    internal: true
  candy:
    name: candy

volumes:
  prometheus-data:
