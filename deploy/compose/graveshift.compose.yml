# SCAFFOLD ONLY - not a working stack. Replace before use.
# Graveshift core services (Compose mode). No real secrets; env placeholders only.
services:
  graveshift:
    # Main daemon: Wraith -> Medium -> Exorcist -> Banshee, HTTP API + SSE.
    image: graveshift/daemon:PLACEHOLDER
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # SEC-1: never mount /var/run/docker.sock here; use socket-proxy below.
    environment:
      GRAVESHIFT_MODE: propose
      # GRAVESHIFT_DISCORD_TOKEN: "<set via env, never commit>"
    depends_on: [socket-proxy, prometheus]

  socket-proxy:
    # Read-only docker-socket-proxy: CONTAINERS/EVENTS/LOGS/INFO=1, POST=0.
    image: tecnativa/docker-socket-proxy:PLACEHOLDER
    environment:
      CONTAINERS: '1'
      EVENTS: '1'
      LOGS: '1'
      INFO: '1'
      POST: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  actuator:
    # SEC-2: separate container; HMAC-signed approved actions only.
    image: graveshift/actuator:PLACEHOLDER
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:PLACEHOLDER
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

