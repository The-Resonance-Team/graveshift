# SCAFFOLD ONLY - from bootstrap section 9.4 draft. Verify before use.
# graveshift-reader: get/list/watch only. graveshift-actuator: patch api/worker in candy-shop.
apiVersion: v1
kind: ServiceAccount
metadata: { name: graveshift-reader, namespace: graveshift }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: graveshift-reader }
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, events, services, endpoints, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: ['apps']
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ['events.k8s.io']
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: graveshift-reader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: graveshift-reader }
subjects: [{ kind: ServiceAccount, name: graveshift-reader, namespace: graveshift }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: graveshift-actuator, namespace: graveshift }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: graveshift-actuator, namespace: candy-shop }
rules:
  - apiGroups: ['apps']
    resources: [deployments]
    resourceNames: [api, worker]
    verbs: [get, patch]
  - apiGroups: ['apps']
    resources: [deployments/scale]
    resourceNames: [worker]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: graveshift-actuator, namespace: candy-shop }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: graveshift-actuator }
subjects: [{ kind: ServiceAccount, name: graveshift-actuator, namespace: graveshift }]
