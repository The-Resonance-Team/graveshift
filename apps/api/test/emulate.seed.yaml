# One checked-in seed for the two emulators used by the fix e2e suite.
# No real secret: the GitHub App key is generated by emulate at startup.
github:
  users:
    - login: xiro
      name: Test Owner
  repos:
    - owner: xiro
      name: haunted-candy-shop
      language: TypeScript
      auto_init: true
  apps:
    - app_id: 12345
      slug: graveshift-test
      name: Graveshift Test App
      permissions:
        contents: write
        issues: write
        pull_requests: write
      events: [push, pull_request]
      installations:
        - installation_id: 100
          account: xiro
          repository_selection: all

ai:
  strict: true
  models:
    - claude-sonnet-5.5
  rules:
    - id: patch-for-code-bug
      reply:
        - type: object
          value:
            files:
              - path: src/api.ts
                content: 'export const ok = true;'
                linesChanged: 1
