name: oneshot-reusable

# One-shot jobs invoked by the Graveshift platform. No daemon runs here.
on:
  workflow_call:
    inputs:
      work_item_id:
        description: Id of the work item that owns the patch.
        required: true
        type: string
      incident_ref:
        description: Diagnosis reference recorded on the work item.
        required: true
        type: string
      branch_slug:
        description: Safe git branch slug for the draft pull request.
        required: true
        type: string
      patch_payload:
        description: Guarded patch payload supplied by the platform.
        required: true
        type: string
      pr_title:
        description: Title of the draft pull request.
        required: true
        type: string
    secrets:
      model_api_key:
        description: Model key used only by the patch job.
        required: true
      github_token:
        description: Scoped token used only to open a draft pull request.
        required: true

permissions:
  contents: read

concurrency:
  group: oneshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate patch
        env:
          WORK_ITEM_ID: ${{ inputs.work_item_id }}
          INCIDENT_REF: ${{ inputs.incident_ref }}
          BRANCH_SLUG: ${{ inputs.branch_slug }}
          PATCH_PAYLOAD: ${{ inputs.patch_payload }}
          MODEL_API_KEY: ${{ secrets.model_api_key }}
        run: |
          echo "::add-mask::$MODEL_API_KEY"
          test -n "$WORK_ITEM_ID"
          test -n "$INCIDENT_REF"
          test -n "$BRANCH_SLUG"
          test -n "$PATCH_PAYLOAD"
          test -n "$MODEL_API_KEY"
          printf '%s' "$PATCH_PAYLOAD" > patch.json

  open-pr:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          PR_TITLE: ${{ inputs.pr_title }}
          BRANCH_SLUG: ${{ inputs.branch_slug }}
          WORK_ITEM_ID: ${{ inputs.work_item_id }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create --draft \
            --base "$BASE_REF" \
            --head "$BRANCH_SLUG" \
            --title "$PR_TITLE" \
            --body "Draft fix for work item $WORK_ITEM_ID."
