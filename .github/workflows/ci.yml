name: ci

on:
  push:
    branches: [main]
  # Stacked pull requests target earlier stack branches, so do not filter by base branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci-affected: ${{ steps.filter.outputs.ci-affected }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci-affected:
              - 'apps/**'
              - 'packages/**'
              - 'examples/**'
              - 'scripts/**'
              - 'tests/**'
              - 'graveshift.config.yaml'
              - 'deploy/**'
              - '.github/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'tsconfig*.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'

  format:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Check formatting
        run: bun run format:check

  lint:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Lint
        run: bun run lint

  db:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Validate Prisma schema
        run: bun run --filter @graveshift/api prisma:validate
      - name: Check migration drift
        run: bun run migrate:drift:check
      - name: Check MCP client drift
        run: bun run mcp:drift:check

  typecheck:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Typecheck
        run: bun run typecheck

      - name: Check generated API contract
        run: bun run generate:check

  test-types:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Type-check tests
        run: bun run test:check

  test:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Test
        run: bun run test

  test-database:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The gate starts its own throwaway Postgres through Docker Compose in
    # scripts/test-database.ts. No service container and no Graveshift daemon run here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Database tests
        run: bun run test:database

  build:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Build runtime entrypoints
        run: bun run build

  ci-structure:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Test workflow structure
        run: bun test ./.github/tests/workflow-structure.test.ts

  compose:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event.pull_request.draft != true) && needs.changes.outputs.ci-affected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - name: Validate Compose files
        # Dummy values satisfy the ${VAR:?} guards. No broker or daemon starts.
        env:
          NATS_PUBLISH_USER: ci-dummy-publish-user
          NATS_PUBLISH_PASSWORD: ci-dummy-publish-password
          NATS_READ_USER: ci-dummy-read-user
          NATS_READ_PASSWORD: ci-dummy-read-password
        run: |
          docker compose -f deploy/compose/graveshift.compose.yml config -q
          docker compose -f deploy/compose/demo.compose.yml config -q
      - name: Test Compose structure
        run: bun test ./.github/tests/compose-structure.test.ts
      - name: Validate Dockerfiles
        run: |
          docker build --check -f deploy/compose/bun.Dockerfile .
          docker build --check -f examples/haunted-candy-shop/Dockerfile examples/haunted-candy-shop

  verify:
    if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.draft != true) }}
    needs:
      [
        changes,
        format,
        lint,
        db,
        typecheck,
        test-types,
        test,
        test-database,
        build,
        ci-structure,
        compose,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
