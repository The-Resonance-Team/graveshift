name: oneshot

# Thin manual entry point. Calls the reusable one-shot jobs unchanged.
on:
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Id of the work item that owns the patch.
        required: true
        type: string
      incident_ref:
        description: Diagnosis reference recorded on the work item.
        required: true
        type: string
      branch_slug:
        description: Graveshift branch slug that receives the patch.
        required: true
        type: string
      patch_payload:
        description: Guarded patch with baseSha and per-file baseBlobSha from the platform.
        required: true
        type: string
      policy_decision:
        description: Signed platform policy decision with bound job metadata.
        required: true
        type: string
      policy_signature:
        description: HMAC-SHA256 signature supplied by the trusted platform.
        required: true
        type: string
      pr_title:
        description: Title of the draft pull request.
        required: true
        type: string
      base_ref:
        description: Base branch for the draft pull request, including stacked PRs.
        required: true
        type: string
      base_sha:
        description: Full base commit SHA bound to the signed platform decision.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oneshot-dispatch-${{ inputs.work_item_id }}
  cancel-in-progress: false

jobs:
  oneshot:
    uses: ./.github/workflows/oneshot-reusable.yml
    with:
      work_item_id: ${{ inputs.work_item_id }}
      incident_ref: ${{ inputs.incident_ref }}
      branch_slug: ${{ inputs.branch_slug }}
      patch_payload: ${{ inputs.patch_payload }}
      policy_decision: ${{ inputs.policy_decision }}
      policy_signature: ${{ inputs.policy_signature }}
      pr_title: ${{ inputs.pr_title }}
      base_ref: ${{ inputs.base_ref }}
      base_sha: ${{ inputs.base_sha }}
    secrets:
      pr_token: ${{ secrets.GRAVESHIFT_PR_TOKEN }}
      policy_signing_key: ${{ secrets.GRAVESHIFT_POLICY_SIGNING_KEY }}
