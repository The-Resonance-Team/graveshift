name: oneshot

# Thin manual entry point. Calls the reusable one-shot jobs unchanged.
on:
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Id of the work item that owns the patch.
        required: true
        type: string
      incident_ref:
        description: Diagnosis reference recorded on the work item.
        required: true
        type: string
      branch_slug:
        description: Safe git branch slug for the draft pull request.
        required: true
        type: string
      patch_payload:
        description: Guarded patch payload supplied by the platform.
        required: true
        type: string
      pr_title:
        description: Title of the draft pull request.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oneshot-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oneshot:
    uses: ./.github/workflows/oneshot-reusable.yml
    with:
      work_item_id: ${{ inputs.work_item_id }}
      incident_ref: ${{ inputs.incident_ref }}
      branch_slug: ${{ inputs.branch_slug }}
      patch_payload: ${{ inputs.patch_payload }}
      pr_title: ${{ inputs.pr_title }}
    secrets:
      model_api_key: ${{ secrets.MODEL_API_KEY }}
      github_token: ${{ secrets.GRAVESHIFT_PR_TOKEN }}
